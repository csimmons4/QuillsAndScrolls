<!doctype html>
<html lang="en" data-theme="parchment" data-tone="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="D&amp;D 5e character sheets, spells, inventory and homebrew, kept on your own computer." />
    <meta name="theme-color" content="#5a4022" />
    <meta name="apple-mobile-web-app-title" content="Quills &amp; Scrolls" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Quills &amp; Scrolls — D&amp;D 5e Character App</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      // Keep these lists in step with THEMES in src/theme/theme.tsx.
      try {
        var t = localStorage.getItem('qs:theme');
        if (t === 'frost') t = 'light';   // Frost was folded into Light
        if (['parchment', 'light', 'dark', 'forest', 'feywild', 'arcane', 'ember'].indexOf(t) < 0) t = 'parchment';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-tone', ['dark', 'arcane', 'ember'].indexOf(t) < 0 ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
